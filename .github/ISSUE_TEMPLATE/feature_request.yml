name: Feature request
description: Suggest something Rewyn should be able to do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: >
        What are you trying to do that is hard today? Describe the situation
        rather than the solution — it often turns out there is a better one.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
      description: If you have an API shape in mind, sketch it.
      render: python
  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
      description: Workarounds, other libraries, or why the current API does not fit.
