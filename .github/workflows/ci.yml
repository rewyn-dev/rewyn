name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --all-extras --python ${{ matrix.python-version }}
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Typecheck
        run: uv run mypy
      - name: Test
        run: uv run pytest --cov --cov-report=xml
      - name: Examples and demo
        # Every runnable artifact in the repository must actually run. The
        # test suite covers them too; this catches a packaging or entry point
        # problem the tests would not.
        env:
          DEMO_SPEED: "0"
          REWYN_HOME: ${{ runner.temp }}/.rewyn
        run: |
          uv run python examples/quickstart.py
          uv run python -m examples.replay_and_regression
          uv run python -m examples.enterprise_research_agent
          uv run python -m demo

  console:
    # The console is built once and shipped in the wheel, so the build, its
    # unit tests and the browser tests all have to pass on a clean checkout.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: |
          uv sync --all-extras
          cd web && npm ci
      - name: Lint, typecheck and unit test the console
        run: |
          cd web
          npm run format:check
          npm run lint
          npm run typecheck
          npm run test -- --run
      - name: Build the console
        run: make build-web
      - name: The committed bundle matches the build
        # src/rewyn/ui/static is committed so `pip install rewyn[ui]`
        # needs no Node. A stale bundle would ship an old interface.
        run: git diff --exit-code --stat -- src/rewyn/ui/static
      - name: Browser tests
        run: |
          cd web
          npx playwright install --with-deps chromium
          npm run e2e
