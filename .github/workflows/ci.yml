name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --all-extras --python ${{ matrix.python-version }}
      - name: Lint
        run: |
          uv run --all-extras ruff check .
          uv run --all-extras ruff format --check .
      - name: Typecheck
        run: uv run --all-extras mypy
      - name: Test
        run: uv run --all-extras pytest --cov --cov-report=xml
      - name: Examples and demo
        # Every runnable artifact in the repository must actually run. The
        # test suite covers them too; this catches a packaging or entry point
        # problem the tests would not.
        env:
          DEMO_SPEED: "0"
          REWYN_HOME: ${{ runner.temp }}/.rewyn
        run: |
          uv run --all-extras python examples/quickstart.py
          uv run --all-extras python -m examples.replay_and_regression
          uv run --all-extras python -m examples.enterprise_research_agent
          uv run --all-extras python -m demo

  console:
    # The console is built once and shipped in the wheel, so the build, its
    # unit tests and the browser tests all have to pass on a clean checkout.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: |
          uv sync --all-extras
          cd web && npm ci
      - name: Lint, typecheck and unit test the console
        run: |
          cd web
          npm run format:check
          npm run lint
          npm run typecheck
          npm run test -- --run
      - name: Build the console
        run: make build-web
      # The bundle is not committed and is not diffed: Next builds through a
      # per-platform SWC binary, so a macOS build and a Linux build differ in
      # their chunk hashes while rendering identically. Building it here proves
      # it builds; the release workflow builds the one that ships.
      - name: Browser tests
        run: |
          cd web
          npx playwright install --with-deps chromium
          npm run e2e
