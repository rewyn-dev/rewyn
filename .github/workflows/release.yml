name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # The tag is not trusted on its own: a mistyped or stale tag would otherwise
  # publish the wrong version under the right name, which cannot be undone.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install 3.11
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Check
        run: |
          uv run --all-extras ruff check .
          uv run --all-extras ruff format --check .
          uv run --all-extras mypy
          uv run --all-extras pytest -q
      - name: Tag must match the packaged version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(uv run --all-extras python -c 'import rewyn; print(rewyn.__version__)')"
          echo "tag=$tag package=$pkg"
          test "$tag" = "$pkg"
      - name: Changelog must describe this version
        run: grep -q "^## \[${GITHUB_REF_NAME#v}\]" CHANGELOG.md

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The console ships in the wheel but is not committed, so the artifact
      # that goes to PyPI is built here, on Linux, from the lockfile.
      - name: Build the console
        run: make build-web
      - name: Build
        run: uv build
      # A wheel that imports only in the repository is the classic packaging
      # bug: the console bundle and py.typed ship as data, not as modules.
      - name: The wheel must work on its own
        run: |
          uv venv /tmp/clean
          VIRTUAL_ENV=/tmp/clean uv pip install dist/*.whl
          /tmp/clean/bin/rewyn --version
          /tmp/clean/bin/rewyn doctor
          VIRTUAL_ENV=/tmp/clean uv pip install "$(ls dist/*.whl)[ui]"
          /tmp/clean/bin/python -c "import importlib.resources as r, rewyn.ui; \
            assert (r.files('rewyn.ui') / 'static' / 'index.html').is_file()"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # Trusted Publishing: no API token is stored anywhere
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --notes "See [CHANGELOG.md](https://github.com/rewyn-dev/rewyn/blob/main/CHANGELOG.md)."
