name: Docs

on:
  push:
    branches: [main]
    paths: ["docs/**", "landing/**", "mkdocs.yml", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Pinned: MkDocs 2.0 removes the plugin and theming systems with no
      # migration path, so an unpinned install would break the site silently.
      - run: pip install "mkdocs-material~=9.6" "mkdocs~=1.6"
      # The landing page is the site root; the documentation sits under
      # /docs/. --strict still fails on a broken internal link, so a renamed
      # page cannot quietly leave dead links behind.
      - run: mkdocs build --strict --site-dir _site/docs
      - name: Place the landing page at the root
        run: |
          cp landing/index.html _site/index.html
          cp landing/CNAME _site/CNAME
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
