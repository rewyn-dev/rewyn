[project]
name = "rewyn"
version = "0.1.2"
description = "Universal AI engineering SDK: build, run, record, replay, evaluate and regression-test AI agents."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Rewyn Contributors" }]
keywords = ["ai", "agents", "llm", "mcp", "evaluation", "replay", "observability"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]
dependencies = [
  "jsonschema>=4.20",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "typer>=0.12",
]

[project.optional-dependencies]
openai = ["openai>=1.50"]
anthropic = ["anthropic>=0.60"]
google = ["google-genai>=1.0"]
mcp = ["mcp>=1.2"]
otel = ["opentelemetry-api>=1.25", "opentelemetry-sdk>=1.25"]
remote = ["httpx>=0.27"]
redis = ["redis>=5.0"]
s3 = ["boto3>=1.34"]
search = ["elasticsearch>=8.12"]
ui = ["fastapi>=0.115", "uvicorn>=0.30"]
all = [
  "rewyn[openai,anthropic,google,mcp,otel,remote,redis,s3,search,ui]",
]

[project.scripts]
rewyn = "rewyn.cli.main:app"

[project.urls]
Homepage = "https://rewyn.dev"
Repository = "https://github.com/rewyn-dev/rewyn"
Documentation = "https://github.com/rewyn-dev/rewyn/tree/main/docs"
Changelog = "https://github.com/rewyn-dev/rewyn/blob/main/CHANGELOG.md"
Issues = "https://github.com/rewyn-dev/rewyn/issues"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

# src/rewyn/ui/static is gitignored, and hatchling honours .gitignore when it
# decides what to package. Without this the console would be silently missing
# from every wheel and sdist, which is the exact failure the release workflow
# checks for.
[tool.hatch.build]
artifacts = ["src/rewyn/ui/static/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/rewyn"]

[tool.hatch.build.targets.sdist]
include = ["src/rewyn", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = []
# Honour the exclusion even when a path is passed explicitly. The product
# specification is the source of truth and must never be reformatted by a
# glob that happens to include it.
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "N", "ASYNC", "PT", "T20", "PL", "C4"]
ignore = [
  "PLR0913", # many arguments are intentional on public constructors
  "PLR2004", # magic values in tests and small comparisons
  "PLR0912", # branches in adapters translating provider formats
  "PLR0915", # statements in translation code
  "PLR0911", # returns in dispatch helpers
  "RUF012",  # pydantic models use mutable class attrs by design
  "PLC0415", # lazy imports keep subpackages independent (modularity rule)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR", "T20", "ANN", "N803"]  # boto3 kwargs are PascalCase
"examples/**" = ["T20"]
"demo/**" = ["T20"]  # a demo is printed output
"src/rewyn/cli/**" = ["T20", "PLR0917", "PT"]

[tool.ruff.lint.isort]
known-first-party = ["rewyn"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["src"]
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*", "openai", "openai.*", "anthropic", "anthropic.*", "google.genai", "google.genai.*", "mcp", "mcp.*", "opentelemetry.*", "redis", "redis.*", "boto3", "botocore.*", "elasticsearch", "elasticsearch.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
markers = [
  "integration: tests that need external services",
  "performance: budget assertions against the seeded project (UI spec §50)",
]
filterwarnings = ["error::DeprecationWarning:rewyn.*"]

[tool.coverage.run]
source = ["rewyn"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
